<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hospital Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#198754,#20c997);
        }

        .login-box{
            width:400px;
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
            animation:fadeIn 0.8s ease;
        }

        .login-box h2{
            text-align:center;
            margin-bottom:30px;
            color:#198754;
            font-weight:700;
        }

        .form-control{
            height:50px;
            border-radius:12px;
            margin-bottom:20px;
        }

        .btn-login{
            width:100%;
            height:50px;
            border:none;
            border-radius:12px;
            background:#198754;
            color:white;
            font-size:18px;
            font-weight:600;
            transition:0.3s;
        }

        .btn-login:hover{
            background:#157347;
        }

        .error{
            text-align:center;
            color:red;
            margin-top:15px;
        }

        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(20px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h2>🏥 Hospital Login</h2>

        <form method="POST">

            {% csrf_token %}

            <input type="text"
                   name="username"
                   class="form-control"
                   placeholder="Enter Username">

            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Enter Password">

            <button type="submit" class="btn-login">
                Login
            </button>

        </form>

        <div class="error">
            {{ error }}
        </div>

    </div>

</body>
</html>
