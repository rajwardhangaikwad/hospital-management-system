<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hospital Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            background:#f4f7fb;
        }

        .sidebar{
            width:260px;
            height:100vh;
            position:fixed;
            background:#198754;
            padding-top:20px;
            box-shadow:0 0 20px rgba(0,0,0,0.1);
        }

        .logo{
            text-align:center;
            color:white;
            font-size:28px;
            font-weight:700;
            margin-bottom:30px;
        }

        .sidebar a{
            display:block;
            color:white;
            text-decoration:none;
            padding:15px 25px;
            margin:10px;
            border-radius:10px;
            font-size:17px;
            transition:0.3s;
        }

        .sidebar a:hover{
            background:white;
            color:#198754;
            transform:translateX(5px);
        }

        .content{
            margin-left:280px;
            padding:30px;
        }

        .topbar{
            background:white;
            padding:20px;
            border-radius:15px;
            box-shadow:0 0 15px rgba(0,0,0,0.08);
            margin-bottom:30px;
        }

        .card-box{
            border:none;
            border-radius:20px;
            padding:30px;
            background:white;
            box-shadow:0 0 15px rgba(0,0,0,0.08);
        }

        .btn-success{
            background:#198754;
            border:none;
            padding:10px 20px;
            border-radius:10px;
        }

        .table{
            margin-top:20px;
        }

        .table thead{
            background:#198754;
            color:white;
        }

    </style>

</head>

<body>

    <div class="sidebar">

        <div class="logo">
             HMS
        </div>

        <a href="{% url 'dashboard' %}">
             Dashboard
        </a>

        <a href="{% url 'add_patient' %}">
             Add Patient
        </a>

        <a href="{% url 'patient_list' %}">
             Patients
        </a>
        <a href="{% url 'add_appointment' %}">
             Appointment
        </a>  

        <a href="{% url 'logout' %}">
             Logout
        </a>

    </div>

    <div class="content">

        <div class="topbar">
            <h3>Hospital Management System</h3>
        </div>

        {% block content %}

        {% endblock %}

    </div>

</body>
</html>
